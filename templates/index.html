<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电梯配件管理</title>
    <link rel="icon" href="/static/img/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/static/img/site-logo.png">
    <link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/sidebar.css">
<link rel="stylesheet" href="/static/css/product-detail.css">
<link rel="stylesheet" href="/static/css/dialogs.css?v=20260731-1">
</head>
<body>
    <aside class="classification-sidebar">
        <div class="classification-header">
            <img class="site-brand-logo" src="/static/img/site-logo.png" alt="电梯配件管理系统">
            <div>
                <h2>产品分类</h2>
                <p>按 Excel 方案的三级分类筛选</p>
            </div>
        </div>
        <div class="classification-tree" id="classificationTree">
            <div class="loading"><div class="spinner"></div>加载中...</div>
        </div>
    </aside>

    <div class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title-row">
                <h1>配件管理</h1>
                <div class="sidebar-title-actions">
                    <a class="log-page-btn" href="/logs">操作日志</a>
                    <button class="add-product-btn" onclick="openProductCreate()">＋ 新增产品</button>
                </div>
            </div>
            <div class="subtitle" id="headerSubtitle">加载中...</div>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索产品名称、型号、品牌..." oninput="debounceSearch()">
            <button type="button" id="duplicateFilterButton" class="duplicate-filter-button" onclick="toggleDuplicateFilter()" aria-pressed="false">只看重复</button>
        </div>
        <div class="product-count" id="productCount">加载中...</div>
        <div class="product-list" id="productList"></div>
        <div class="pagination" id="pagination"></div>
    </div>

    <div class="main-content" id="mainContent">
        <div class="empty-state">
            <div class="icon">&#128214;</div>
            <p>请从左侧选择一个产品查看详情</p>
        </div>
    </div>

    <div class="modal-overlay" id="imageModal" onclick="closeModal()">
        <img id="modalImage" src="" alt="大图预览">
    </div>
    <div class="toast" id="toast"></div>
    <input type="file" id="localImageInput" accept="image/*" multiple hidden onchange="uploadLocalImages(this.files)">
    <input type="file" id="createLocalImageInput" accept="image/jpeg,image/png,image/gif,image/webp,image/bmp" multiple hidden onchange="stageCreateLocalImages(this.files)">

    <div class="product-create-overlay" id="productCreateOverlay" onclick="closeProductCreate(event)">
        <div class="product-create-drawer" onclick="event.stopPropagation()">
            <div class="product-create-header">
                <div>
                    <div class="product-create-title">新增产品</div>
                    <div class="product-create-subtitle">本次只新增 parts 主表数据，规格与供应商价格可稍后配置</div>
                </div>
                <button class="product-create-close" onclick="closeProductCreate()">×</button>
            </div>
            <div class="product-create-body" id="productCreateBody"></div>
            <div class="product-create-footer">
                <button class="product-create-cancel" onclick="closeProductCreate()">取消</button>
                <button class="product-create-save" id="productCreateSave" onclick="submitProductCreate()">保存新增</button>
            </div>
        </div>
    </div>

    <div class="product-delete-overlay" id="productDeleteOverlay" onclick="closeProductDelete(event)">
        <div class="product-delete-dialog" onclick="event.stopPropagation()">
            <div class="product-delete-title">删除产品</div>
            <div class="product-delete-message">
                删除后，当前产品主数据以及关联的规格、规格组合和供应商价格将一并删除，无法恢复。
            </div>
            <div class="product-delete-target" id="productDeleteTarget"></div>
            <label class="product-delete-confirm-label" for="productDeleteIdInput">
                请输入产品 ID <strong id="productDeleteExpectedId"></strong> 以确认删除
            </label>
            <input class="product-delete-id-input" id="productDeleteIdInput" type="text"
                   inputmode="numeric" autocomplete="off" placeholder="输入产品ID"
                   oninput="validateProductDeleteId()" onkeydown="handleProductDeleteKeydown(event)">
            <div class="product-delete-actions">
                <button class="product-delete-cancel" onclick="closeProductDelete()">取消</button>
                <button class="product-delete-confirm" id="productDeleteConfirmBtn"
                        onclick="submitProductDelete()" disabled>确认删除</button>
            </div>
        </div>
    </div>

    <!-- 图片库选择弹窗 -->
    <div class="imglib-overlay" id="imglibOverlay">
        <div class="imglib-modal" onclick="event.stopPropagation()">
            <div class="imglib-header">
                <h3 id="imglibTitle">从图片库选择</h3>
                <button class="close-btn" onclick="closeImgLib()">&#10005;</button>
            </div>
            <div class="imglib-body">
                <div class="imglib-sidebar" id="imglibSidebar"></div>
                <div class="imglib-content">
                    <div class="imglib-toolbar">
                        <input type="text" id="imglibSearch" placeholder="搜索产品名称/型号..." oninput="imglibSearchDebounce()">
                        <span class="sel-count" id="imglibSelCount">已选 0 张</span>
                    </div>
                    <div class="imglib-grid-wrap" id="imglibGrid"></div>
                    <div class="imglib-pagination" id="imglibPagination"></div>
                </div>
            </div>
            <div class="imglib-footer">
                <button class="lib-btn lib-btn-secondary" onclick="closeImgLib()">取消</button>
                <button class="lib-btn lib-btn-primary" onclick="confirmImgLibSelection()">确认添加</button>
            </div>
        </div>
    </div>

    <!-- 图片放大弹窗 -->
    <div class="imglib-modal-overlay" id="imglibModalOverlay" onclick="closeImglibModal()">
        <div class="imglib-modal-content" onclick="event.stopPropagation()">
            <button class="imglib-modal-close" onclick="closeImglibModal()">&#10005;</button>
            <img id="imglibModalImage" src="" alt="放大图片">
        </div>
    </div>



    <script src="/static/js/state.js"></script>
<script src="/static/js/products.js"></script>
<script src="/static/js/variants.js"></script>
<script src="/static/js/images.js"></script>
</body>
</html>
