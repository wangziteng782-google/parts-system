<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品关联</title>
    <link rel="icon" href="/static/img/favicon.ico" sizes="any">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/product-detail.css">
    <link rel="stylesheet" href="/static/css/inquiry-match.css?v=20261102-3">
</head>
<body>
<div class="im-app">
    <header class="im-head">
        <div class="im-brand">
            <img class="site-brand-logo" src="/static/img/site-logo.png" alt="电梯配件管理系统">
            <div>
                <h1>产品关联</h1>
                <p>从 OA 询价记录查找产品，关联到对应的 SKU 规格组合</p>
            </div>
        </div>
        <div class="im-head-actions">
            <div class="im-flow">① 询价记录　›　② 产品型号　›　③ SKU 关联</div>
            <a class="im-back" href="/goods">← 返回配件管理</a>
        </div>
    </header>

    <main class="im-workspace">
        <section class="im-panel">
            <div class="im-panel-head">
                <div class="im-title">询价记录 <span class="im-count" id="recordCount">0</span></div>
                <span class="im-muted">OA 同步</span>
            </div>
            <div class="im-search">
                <input id="recordSearch" placeholder="搜索名称或规格型号">
                <button id="recordSearchBtn" class="im-btn">查询</button>
            </div>
            <div class="im-tabs" id="recordTabs">
                <button class="im-tab active" data-status="all">全部 <span id="statAll">0</span></button>
                <button class="im-tab" data-status="pending">待关联 <span id="statPending">0</span></button>
                <button class="im-tab" data-status="matched">已关联 <span id="statMatched">0</span></button>
            </div>
            <div class="im-list" id="recordList"></div>
            <div class="im-foot">
                <span class="im-muted" id="recordPageInfo">-</span>
                <div class="im-actions">
                    <button id="recordPrev" class="im-btn im-btn-sm">上一页</button>
                    <button id="recordNext" class="im-btn im-btn-sm">下一页</button>
                </div>
            </div>
        </section>

        <section class="im-panel">
            <div class="im-panel-head">
                <div class="im-title">产品型号 <span class="im-count" id="productCount">加载中…</span></div>
                <button id="createProductBtn" class="im-btn im-btn-sm" title="跳转到产品管理页新增产品">新增产品</button>
            </div>
            <div class="im-search">
                <input id="productSearch" placeholder="输入型号/名称/品牌，输入即搜索" autocomplete="off">
                <button id="productSearchBtn" class="im-btn">查询</button>
            </div>
            <div class="im-list" id="productList"></div>
            <div class="im-foot">
                <span class="im-muted" id="productPageInfo">-</span>
                <div class="im-actions">
                    <button id="productPrev" class="im-btn im-btn-sm">上一页</button>
                    <button id="productNext" class="im-btn im-btn-sm">下一页</button>
                </div>
            </div>
        </section>

        <section class="im-panel">
            <div class="im-panel-head">
                <div class="im-title">SKU 规格 &amp; 配置组合</div>
                <button id="openSpecBtn" class="im-btn im-btn-sm" disabled>新增规格</button>
            </div>
            <div class="im-body" id="skuBody">
                <div class="im-empty">请先在左侧选择产品型号</div>
            </div>
            <div class="im-foot">
                <span class="im-muted" id="matchSummary">尚未完成选择</span>
                <div class="im-actions">
                    <button id="clearMatch" class="im-btn im-btn-sm" disabled>取消关联</button>
                    <button id="saveMatch" class="im-btn im-btn-sm im-btn-primary" disabled>保存关联</button>
                </div>
            </div>
        </section>
    </main>
</div>

<div class="im-detail-overlay" id="detailOverlay" aria-hidden="true">
    <section class="im-detail-modal im-detail-modal--wide" role="dialog" aria-modal="true"
             aria-labelledby="detailTitle">
        <header class="im-detail-header">
            <div class="im-detail-heading">
                <h2 id="detailTitle">任务单号：<span id="detailMissionSn">—</span></h2>
                <span class="im-badge" id="detailMissionType">询价/运费</span>
            </div>
            <button type="button" class="im-detail-close" id="detailClose" aria-label="关闭详情">×</button>
        </header>

        <div class="im-detail-body">
            <div class="im-detail-main">
                <section class="im-detail-block">
                    <div class="im-detail-block-head">
                        <span class="im-detail-block-title">询价商品信息</span>
                        <span class="im-muted">（只读）</span>
                        <div class="im-detail-block-meta">
                            <span id="detailCreator"></span>
                            <span class="im-pill ok" id="detailStatusText"></span>
                            <span class="im-pill" id="detailMissionTime"></span>
                        </div>
                    </div>
                    <div class="im-detail-goods">
                        <div class="im-detail-gallery">
                            <div class="im-detail-image">
                                <img id="detailImage" src="/static/img/site-logo.png" alt="商品图片"
                                     onerror="this.src='/static/img/site-logo.png';this.onerror=null">
                            </div>
                            <div class="im-detail-thumbs" id="detailThumbs" hidden></div>
                        </div>
                        <div class="im-detail-goods-info">
                            <div class="im-detail-goods-name" id="detailGoodsName"></div>
                            <div class="im-detail-goods-spec" id="detailGoodsSpec"></div>
                            <div class="im-detail-goods-meta" id="detailGoodsMeta"></div>
                            <div class="im-detail-desc" id="detailGoodsDesc"></div>
                        </div>
                    </div>
                </section>

                <section class="im-detail-block">
                    <div class="im-detail-block-head">
                        <span class="im-detail-block-title">供应商报价</span>
                        <span class="im-muted">（可多家比价）</span>
                    </div>
                    <div class="im-quote-list" id="detailQuotes"></div>
                </section>
            </div>

            <aside class="im-detail-side">
                <div class="im-detail-block-head">
                    <span class="im-detail-block-title">沟通记录</span>
                    <span class="im-muted" id="detailChatCount"></span>
                </div>
                <div class="im-chat-list" id="detailChatBody"></div>
            </aside>
        </div>

        <footer class="im-detail-footer">
            <span class="im-detail-selected" id="detailSelected"></span>
            <button type="button" class="im-detail-footer-close" id="detailFooterClose">关闭</button>
        </footer>
    </section>
</div>

<div class="im-image-overlay" id="imageOverlay" hidden>
    <button type="button" class="im-image-close" id="imageClose" aria-label="关闭预览">×</button>
    <button type="button" class="im-image-nav prev" id="imagePrev" aria-label="上一张" hidden>&#8249;</button>
    <img id="imagePreview" alt="商品图片">
    <button type="button" class="im-image-nav next" id="imageNext" aria-label="下一张" hidden>&#8250;</button>
</div>

<div class="im-toast" id="toast"></div>

<script src="/static/js/state.js"></script>
<script src="/static/js/variants.js"></script>
<script src="/static/js/inquiry-match.js?v=20261102-4"></script>
</body>
</html>
