<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>询价记录匹配 - 产品库</title>
<style>
/* ========== 复用项目 CSS 变量体系 ========== */
:root{
    --accent:#4285f4;
    --accent-bg:#e8f0fe;
    --accent-hover:#3367d6;
    --bg:#f5f7fa;
    --card-bg:#fff;
    --border:#e8ecf0;
    --border-soft:#eef1f5;
    --text:#1a202c;
    --text-secondary:#4a5568;
    --text-light:#718096;
    --text-muted:#a0aec0;
    --success:#34a853;
    --success-bg:#e6f4ea;
    --danger:#ea4335;
    --danger-bg:#fce8e6;
    --warning:#fbbc04;
    --warning-bg:#fef7e0;
    --shadow:0 1px 4px rgba(0,0,0,0.05);
    --shadow-lg:0 2px 7px rgba(35,52,77,0.05);
}

*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);font:14.5px/1.5 'PingFang SC',-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;color:var(--text)}
button,input,select{font:inherit}
button{border:1px solid var(--border);background:#fff;color:var(--text-secondary);border-radius:6px;padding:7px 10px;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
button:hover{border-color:#bfdbfe;color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:#fff}
button.small{font-size:12px;padding:5px 8px}
button.danger{color:var(--danger);border-color:#fecaca}
button.danger:hover{background:var(--danger-bg)}
input,select{border:1px solid var(--border);border-radius:6px;padding:8px 9px;outline:none;color:var(--text);background:#fff;min-width:0}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}

/* ========== 简化 pagehead（兼容项目 sidebar 布局） ========== */
.pagehead{padding:14px 18px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--border);background:var(--card-bg);flex-shrink:0}
.pagehead h1{font-size:18px;margin:0;color:var(--text);font-weight:700}
.pagehead p{margin:2px 0 0;color:var(--text-light);font-size:13px}
.flow{font-size:13px;background:var(--card-bg);border:1px solid var(--border);border-radius:7px;padding:8px 11px;color:var(--text-light)}

/* ========== 四栏核心布局 ========== */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.workspace{
    display:grid;
    grid-template-columns:minmax(230px,.8fr) minmax(220px,.75fr) minmax(240px,.8fr) minmax(420px,1.6fr);
    grid-template-rows:1fr;
    gap:12px;
    padding:12px 14px 14px;
    flex:1;
    min-height:0;
    overflow:hidden;
}
.panel{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:10px;
    display:flex;
    flex-direction:column;
    min-width:0;
    min-height:0;
    overflow:hidden;
    box-shadow:var(--shadow-lg);
}
.panel-head{
    padding:14px 15px 12px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    flex-shrink:0;
}
.title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--text)}
.count{font-size:12px;background:var(--accent-bg);color:var(--accent);border-radius:10px;padding:2px 8px;font-weight:600}
.muted{font-size:12px;color:var(--text-muted);font-weight:400}

.search{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--border-soft)}
.search input{width:100%}
.tabs{display:flex;gap:5px;padding:0 10px 9px}
.tab{font-size:12px;background:#f5f7fa;border:1px solid transparent;padding:5px 9px;color:var(--text-light);border-radius:6px}
.tab.active{background:var(--accent-bg);border-color:#bfdbfe;color:var(--accent)}

/* 通用列表样式 */
.records{padding:4px 7px 10px;overflow:auto;flex:1;min-height:0}
.record{
    display:grid;
    grid-template-columns:22px 1fr auto;
    gap:8px;
    padding:9px 8px;
    border-left:3px solid transparent;
    border-radius:7px;
    margin:2px 0;
    cursor:pointer;
    transition:background .12s,border-color .12s;
}
.record:hover{background:#f8faff}
.record.active{background:#eaf2ff;border-left-color:var(--accent)}
.n{font-size:14px;color:#6698ff;text-align:center;font-weight:700;padding-top:1px}
.rmain{min-width:0}
.rname{font-weight:650;display:flex;align-items:center;gap:5px;flex-wrap:wrap;color:var(--text)}
.model{font-size:12px;color:var(--text-light);margin-top:2px}
.rmeta{font-size:11px;color:var(--text-muted);margin-top:4px;line-height:1.6;display:flex;flex-wrap:wrap;gap:8px 12px}
.rmeta .price{color:var(--accent);font-weight:600}
.rmeta .price.missing{color:var(--text-muted);font-weight:400}
.rbtns{display:flex;gap:4px;align-self:center}
.detail-link{color:var(--accent);font-size:12px;cursor:pointer;border:none;background:none;padding:0 4px}
.detail-link:hover{text-decoration:underline}
.pill{font-size:11px;padding:2px 7px;border-radius:4px;background:var(--warning-bg);color:#b56b15}
.pill.ok{background:var(--success-bg);color:var(--success)}

.body{padding:13px;overflow:auto;flex:1;min-height:0}
.tip{background:var(--accent-bg);border:1px solid #bfdbfe;color:var(--accent);padding:10px;border-radius:7px;font-size:12px;line-height:1.7;margin-bottom:12px}
.section-title{font-weight:700;font-size:13px;margin:4px 0 10px;display:flex;align-items:center;justify-content:space-between;color:var(--text)}

/* ========== 三级树形分类样式 ========== */
.tree-wrap{padding:4px 6px 10px;overflow:auto;flex:1;min-height:0}
.tree-node{margin:2px 0}
.tree-row{
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px 6px;
    border-radius:6px;
    cursor:pointer;
    transition:background .1s;
}
.tree-row:hover{background:#f7f9fc}
.tree-row.selected{background:var(--accent-bg);color:var(--accent)}
.tree-indent-1{padding-left:14px}
.tree-indent-2{padding-left:28px}
.tree-expander{width:18px;height:18px;display:grid;place-items:center;font-size:14px;color:var(--text-muted);flex-shrink:0}
.tree-label{flex:1;font-size:12px}
.tree-small{font-size:11px;color:var(--text-muted);margin-left:4px}
.tree-children{overflow:hidden}

.center-foot,.right-foot{
    padding:10px 13px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    flex-shrink:0;
}
.empty{padding:28px 10px;text-align:center;border:1px dashed var(--border);border-radius:7px;color:var(--text-muted);font-size:12px}

/* 第四列 SKU规格详情区域 */
.spec-area{margin-top:14px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.spec-head{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;background:#fafbfd;border-bottom:1px solid var(--border);gap:8px}
.spec-head strong{font-size:13px;color:var(--text)}
.spec-body{padding:14px 16px 16px}

/* ===== 淘宝风格 SKU 选择器 ===== */
.sku-row{padding:12px 0;border-bottom:1px dashed var(--border-soft)}
.sku-row:last-of-type{border-bottom:0}
.sku-row-label{font-size:13px;color:var(--text);font-weight:600;margin-bottom:10px}
.sku-row-values{display:flex;flex-wrap:wrap;gap:10px 16px}
.sku-value{
    border:1px solid #d0d7de;background:#fff;color:var(--text-secondary);
    padding:6px 20px;border-radius:4px;font-size:13px;cursor:pointer;
    transition:border-color .12s,color .12s,background .12s;user-select:none;min-width:70px;text-align:center;
}
.sku-value:hover{border-color:var(--accent);color:var(--accent)}
.sku-value.selected{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:600}

.add-sku-row{display:flex;gap:8px;margin-top:10px;padding-top:12px;border-top:1px solid var(--border-soft)}
.add-sku-row input{flex:1}
.section-title{font-weight:700;font-size:13px;margin:4px 0 10px;display:flex;align-items:center;justify-content:space-between;color:var(--text)}

.combo-title{margin:15px 0 8px;font-size:13px;font-weight:700;color:var(--text)}
.combo-desc{font-size:11px;color:var(--text-muted);margin:-3px 0 9px}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:7px}
.combo-table{border-collapse:collapse;width:100%;font-size:12px;min-width:560px}
.combo-table th{background:#f7f9fc;color:var(--text-secondary);text-align:left;padding:9px 8px;border-bottom:1px solid var(--border);white-space:nowrap;font-weight:600}
.combo-table td{padding:8px;border-bottom:1px solid var(--border-soft);white-space:nowrap}
.combo-table tr:last-child td{border-bottom:0}
.combo-table tr.configured{background:var(--success-bg)}
.combo-table tr.unconfigured{background:#fff9f2}
.combo-table input{width:100%;min-width:70px;padding:7px;border-radius:5px}
.combo-table input.ready{border-color:#86efac;color:var(--success)}
.combo-table input.missing{border-color:#fcd34d;background:var(--warning-bg)}
.combo-table .operation{display:flex;align-items:center;gap:5px}
.combo-table .operation button{padding:5px 7px;font-size:10px}
.status{color:var(--success);font-size:11px;font-weight:600}
.status.wait{color:var(--warning)}

.notice-bottom{font-size:11px;color:var(--text-muted);line-height:1.7;margin-top:9px}
.primary-row{display:flex;gap:7px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,15px);opacity:0;transition:.2s;background:#2c3b52;color:#fff;border-radius:7px;padding:10px 15px;z-index:20;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ========== 详情弹框 ========== */
.modal-mask{position:fixed;inset:0;background:rgba(26,32,44,.45);z-index:30;display:none;align-items:center;justify-content:center}
.modal-mask.show{display:flex}
.modal{background:var(--card-bg);border-radius:10px;width:min(520px,90vw);max-height:80vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 12px 36px rgba(0,0,0,.2)}
.modal-head{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.modal-head h3{margin:0;font-size:15px;color:var(--text)}
.modal-close{border:0;background:transparent;color:var(--text-muted);font-size:18px;cursor:pointer;padding:0 4px}
.modal-close:hover{color:var(--text)}
.modal-body{padding:16px 18px;overflow:auto;flex:1}
.detail-row{display:grid;grid-template-columns:90px 1fr;gap:10px 14px;padding:9px 0;border-bottom:1px dashed var(--border-soft);font-size:13px}
.detail-row:last-child{border-bottom:0}
.detail-row .label{color:var(--text-muted);font-weight:500}
.detail-row .value{color:var(--text);word-break:break-all}
.detail-row .value.price{color:var(--accent);font-weight:700}
.detail-row .value.empty{color:var(--text-muted);font-style:italic}

/* ========== 响应式降级 ========== */
@media(max-width:1440px){
    .workspace{
        grid-template-columns:minmax(220px,.85fr) minmax(210px,.75fr) minmax(220px,.75fr) minmax(360px,1.4fr);
    }
}
@media(max-width:1180px){
    .workspace{
        grid-template-columns:minmax(230px,1fr) minmax(220px,1fr);
    }
    .panel-col3{grid-column:1/-1;min-height:420px}
    .panel-col4{grid-column:1/-1;min-height:520px}
    .app{height:auto}
    .workspace{flex:initial}
    .panel{min-height:420px}
}
@media(max-width:720px){
    .workspace{display:flex;flex-direction:column;padding:0 8px 10px}
    .pagehead{align-items:flex-start;flex-direction:column}
    .spec-label,.spec-values{grid-template-columns:80px 1fr}
    .spec-label span:last-child{display:none}
}
</style>
</head>
<body>
<div class="app">
<div class="pagehead">
    <div>
        <h1>询价记录匹配与产品维护</h1>
        <p>从 OA 询价记录中选择待处理项 → 选择三级产品分类 → 选择产品型号 → 匹配 SKU 规格保存关系</p>
    </div>
    <div class="flow">①选择询价记录　›　②选择三级分类　›　③选择产品型号　›　④保存匹配</div>
</div>

<main class="workspace">
    <!-- 第1列：询价记录 -->
    <section class="panel panel-col1">
        <div class="panel-head">
            <div class="title">询价记录 <span class="count" id="recordCount">8 条</span></div>
            <span class="muted">OA 同步</span>
        </div>
        <div class="search"><input id="recordSearch" placeholder="搜索名称或规格型号"><button id="clearSearch" class="small">清空</button></div>
        <div class="tabs">
            <button class="tab active" data-filter="all">全部</button>
            <button class="tab" data-filter="pending">待匹配</button>
            <button class="tab" data-filter="matched">已匹配</button>
        </div>
        <div class="records" id="records"></div>
        <div class="center-foot">
            <span class="muted">由 OA 询价项目同步，不支持此处新增</span>
            <button class="small" id="syncBtn">⟳ 刷新</button>
        </div>
    </section>

    <!-- 第2列：三级产品分类树 -->
    <section class="panel panel-col2">
        <div class="panel-head">
            <div class="title">产品分类 <span class="count" id="categoryTreeCount">6 大类</span></div>
        </div>
        <div class="body">
            <div class="section-title">选择分类节点 <span class="muted">单选</span></div>
            <div class="tree-wrap" id="categoryTree"></div>
        </div>
    </section>

    <!-- 第3列：产品型号列表 -->
    <section class="panel panel-col3">
        <div class="panel-head">
            <div class="title">产品型号 <span class="count" id="modelListCount">请先选择分类</span></div>
        </div>
        <div class="search"><input id="modelSearch" placeholder="搜索产品名称/型号/品牌"><button id="clearModelSearch" class="small">清空</button></div>
        <div class="records" id="modelRecords"></div>
    </section>

    <!-- 第4列：SKU规格与组合详情 -->
    <section class="panel panel-col4">
        <div class="panel-head">
            <div class="title">SKU 规格 & 配置组合</div>
        </div>
        <div class="body" id="detailBody">
            <div id="skuAreaWrap"><div class="empty">请先在左侧选择产品型号</div></div>
        </div>
        <div class="right-foot">
            <span class="muted" id="matchSummary">尚未完成全部选择</span>
            <div class="primary-row">
                <button class="small" id="clearMatch">清除</button>
                <button class="primary" id="saveMatch">保存匹配</button>
            </div>
        </div>
    </section>
</main>
</div>
<div class="toast" id="toast"></div>

<!-- 询价记录详情弹框 -->
<div class="modal-mask" id="detailModal">
    <div class="modal">
        <div class="modal-head">
            <h3 id="detailTitle">询价记录详情</h3>
            <button class="modal-close" id="detailClose">×</button>
        </div>
        <div class="modal-body" id="detailBody"></div>
    </div>
</div>

<!-- 规格编辑弹框 -->
<div class="modal-mask" id="specModal">
    <div class="modal" style="width:min(480px,92vw)">
        <div class="modal-head">
            <h3 id="specModalTitle">新增规格</h3>
            <button class="modal-close" id="specModalClose">×</button>
        </div>
        <div class="modal-body">
            <div class="detail-row"><div class="label">规格名称</div><div class="value"><input id="specModalName" style="width:100%" placeholder="如：电压、材质"></div></div>
            <div class="detail-row"><div class="label">规格值</div><div class="value" style="display:flex;gap:6px;flex-wrap:wrap" id="specModalValues"></div></div>
            <div class="detail-row"><div class="label">新增值</div><div class="value" style="display:flex;gap:6px"><input id="specModalNewVal" placeholder="输入后回车" style="flex:1"><button class="small" id="specModalAddVal">添加</button></div></div>
        </div>
        <div class="center-foot">
            <span class="muted">规格值点击 × 可移除</span>
            <div style="display:flex;gap:6px">
                <button class="small" id="specModalDelete" style="display:none">删除此规格</button>
                <button class="primary" id="specModalSave">保存</button>
            </div>
        </div>
    </div>
</div>

<script>
// ========== Mock 数据 ==========
// ========== Mock 数据（来自 OA 询价真实字段） ==========
// inquiry_mission_id: OA 询价任务主键
// product_name: goods_name → 品类名
// specification: goods_spec → 规格型号（唯一可用的型号来源）
// product_brand: factory_name → 厂家名（可能为空）
// purchase_price: 询价价格（可能为空）
// quote_updated_at: 最后更新时间

const categoryTreeData = [
    {catKey:"电气部件",catName:"电气部件",expand:true,children:[
        {catKey:"电气部件>主控板",catName:"主控板类",expand:true,children:[]},

        {catKey:"电气部件>传感器",catName:"传感器部件",expand:true,children:[]}
    ]},
    {catKey:"显示系统",catName:"显示系统",expand:true,children:[

        {catKey:"门系统>门锁光幕",catName:"门锁&安全光幕",expand:false,children:[]}
    ]},
    {catKey:"机械部件",catName:"机械部件",expand:false,children:[
        {catKey:"机械部件>电磁铁组件",catName:"电磁铁组件",expand:false,children:[]},
        {catKey:"机械部件>滚轮轴承",catName:"滚轮轴承配件",expand:false,children:[]}

const products=[
{id:101,categoryKey:"电气部件>指令按钮板",name:"指令板",code:"MF3 系列",brand:"富士",skus:["MF3","MF3A"],specs:[
    {name:"功率",values:["20W","40W","60W"]},

// ========== 全局状态 ==========
let selectedId=1;
let filter="all";
let selectedCategoryKey="";
let selectedProductId=null;
let selectedSku="";

const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1900)}
function currentRecord(){return data.find(r=>r.inquiry_mission_id===selectedId)}

// ========== 询价记录详情弹框 ==========
function showDetail(id){
    const r = data.find(x=>x.inquiry_mission_id===id);
    if(!r) return;
    $("detailTitle").textContent = r.product_name + (r.matched?" ✓ 已匹配":" · 待匹配");
    const row = (label, value, cls='') => `<div class="detail-row"><div class="label">${label}</div><div class="value ${cls||(value?'':'empty')}">${value?esc(value):'—'}</div></div>`;
    $("detailBody").innerHTML = [
        row("询价ID", r.inquiry_mission_id),
        row("品类名称", r.product_name),
        row("规格型号", r.specification),
        row("厂家", r.product_brand),
        row("询价价格", r.purchase_price?('￥'+r.purchase_price):null, r.purchase_price?'price':''),
        row("创建人", r.create_user),
        row("创建时间", r.create_time),
        row("最后更新", r.quote_updated_at),
        row("匹配状态", r.matched?'已匹配':'待匹配'),
        r.matched ? row("匹配到产品", r.productId ? (products.find(p=>p.id===r.productId)?.name||'—') : '—') : '',
        r.matched ? row("匹配 SKU", r.sku) : '',
    ].filter(Boolean).join("");
    $("detailModal").classList.add("show");
}
$("detailClose").onclick = () => $("detailModal").classList.remove("show");
$("detailModal").onclick = e => { if(e.target.id==="detailModal") $("detailModal").classList.remove("show"); };
document.addEventListener("keydown", e => { if(e.key==="Escape") $("detailModal").classList.remove("show"); });

// ========== 渲染询价记录列表 ==========
function renderRecords(){
    const q=$("recordSearch").value.trim().toLowerCase();
    const list=data.filter(r=>(filter==="all"||(filter==="matched"?r.matched:!r.matched))&&[r.product_name,r.specification,r.product_brand].join(" ").toLowerCase().includes(q));
    $("recordCount").textContent=data.length+" 条";
    $("records").innerHTML=list.map((r,i)=>`<div class="record ${r.inquiry_mission_id===selectedId?"active":""}" data-id="${r.inquiry_mission_id}">
        <div class="n">${i+1}</div>
        <div class="rmain">
            <div class="rname">${esc(r.product_name)} <span class="pill ${r.matched?"ok":""}">${r.matched?"已匹配":"待匹配"}</span></div>
            <div class="model">${esc(r.specification||'（无规格型号）')}</div>
            <div class="rmeta">
                <span>创建人：${esc(r.create_user||'—')}</span>
                <span>创建时间：${esc(r.create_time||'—')}</span>
                <span class="price ${r.purchase_price?'':'missing'}">${r.purchase_price?'￥'+esc(r.purchase_price):'询价中'}</span>
            </div>
        </div>
        <div class="rbtns"><span class="detail-link" data-detail="${r.inquiry_mission_id}">详情</span></div>
    </div>`).join("")||'<div class="empty">没有符合条件的询价记录</div>';
    document.querySelectorAll(".record").forEach(el=>el.onclick=e=>{
        if(e.target.closest("[data-detail]")) return;
        selectRecord(+el.dataset.id);
    });
    document.querySelectorAll("[data-detail]").forEach(btn=>btn.onclick=e=>{
        e.stopPropagation();
        showDetail(+btn.dataset.detail);
    });
}

// ========== 渲染分类树 ==========
function renderTree(){
    const wrap=$("categoryTree");
    function renderNode(node,level){
        const indentCls = level===1?"":"tree-indent-"+level;
        const hasChildren = node.children && node.children.length>0;
        let html=`<div class="tree-node">
            <div class="tree-row ${indentCls??''} ${selectedCategoryKey===node.catKey?'selected':''}" data-catkey="${esc(node.catKey)}" data-expand="${!!node.expand}" data-haschild="${hasChildren}">
                <span class="tree-expander">${hasChildren?(node.expand?"−":"+"):" "}</span>
                <span class="tree-label">${esc(node.catName)}</span>
                <span class="tree-small">${hasChildren?node.children.length+" 个":""}</span>
            </div>`;
        if(hasChildren && node.expand){
            html += `<div class="tree-children">`;
            node.children.forEach(ch=>html += renderNode(ch,level+1));
            html += `</div>`;
        }
        html += `</div>`;
        return html;
    }
    let treeHtml="";
    categoryTreeData.forEach(top=>treeHtml += renderNode(top,1));
    wrap.innerHTML = treeHtml;
    $("categoryTreeCount").textContent = categoryTreeData.length + " 大类";

    document.querySelectorAll(".tree-row").forEach(row=>{
        row.onclick=e=>{
            const key = row.dataset.catkey;
            const hasCh = row.dataset.haschild==="true";
            const expandState = row.dataset.expand==="true";
            if(e.offsetX <24 && hasCh){
                row.dataset.expand = (!expandState).toString();
                function findNode(list,ckey){
                    for(let n of list){
                        if(n.catKey===ckey) return n;
                        if(n.children){const f=findNode(n.children,ckey);if(f) return f;}
                    }
                    return null;
                }
                const nd = findNode(categoryTreeData,key);
                if(nd) nd.expand = !expandState;
                renderTree();
                return;
            }
            selectedCategoryKey = key;
            selectedProductId=null;selectedSku="";
            renderTree();
            renderModelList();
            $("skuAreaWrap").innerHTML='<div class="empty">请在第三列选择产品型号</div>';
        }
    })
}

// ========== 渲染产品型号列表 ==========
function renderModelList(){
    const wrap=$("modelRecords");
    if(!selectedCategoryKey){
        $("modelListCount").textContent="请先选择分类";
        wrap.innerHTML='<div class="empty">请先在第二列选择三级产品分类</div>';
        return;
    }
    const q=$("modelSearch").value.trim().toLowerCase();
    const modelList = products.filter(p=>p.categoryKey===selectedCategoryKey);
    const filterList = modelList.filter(p=>[p.name,p.code,p.brand,...p.skus].join(" ").toLowerCase().includes(q));
    $("modelListCount").textContent = filterList.length + " 个型号";
    wrap.innerHTML = filterList.map((m,i)=>`
    <div class="record ${m.id===selectedProductId?"active":""}" data-prodid="${m.id}">
        <div class="n">${i+1}</div>
        <div>
            <div class="rname">${esc(m.name)} <span class="pill">${esc(m.brand)}</span></div>
            <div class="model">编码：${esc(m.code)}</div>
            <div class="rmeta">SKU：${m.skus.length} 个</div>
        </div>
    </div>`).join("")||`<div class="empty">该分类下暂无产品型号</div>`;

    document.querySelectorAll("#modelRecords .record").forEach(el=>{
        el.onclick=()=>{
            selectedProductId = +el.dataset.prodid;
            selectedSku="";
            renderModelList();
            renderSkuPanel();
        }
    })
}

// ========== 规格编辑弹框状态 ==========
let specModalState = { editingIdx: -1, values: [] };

function openSpecModal(spec, idx){
    specModalState.editingIdx = idx;
    specModalState.values = spec ? [...spec.values] : [];
    $("specModalTitle").textContent = idx >= 0 ? "编辑规格" : "新增规格";
    $("specModalName").value = spec ? spec.name : "";
    $("specModalDelete").style.display = idx >= 0 ? "" : "none";
    renderSpecModalValues();
    $("specModalNewVal").value = "";
    $("specModal").classList.add("show");
    setTimeout(()=>$("specModalName").focus(), 50);
}
function renderSpecModalValues(){
    $("specModalValues").innerHTML = specModalState.values.length
        ? specModalState.values.map((v,i)=>`<span class="chip" style="background:var(--accent);color:white;border-radius:4px;padding:4px 10px;font-size:12px;display:inline-flex;align-items:center;gap:6px">${esc(v)} <button data-sv-remove="${i}" style="background:transparent;border:0;color:white;cursor:pointer;font-size:13px;line-height:1;padding:0">×</button></span>`).join("")
        : '<span class="muted" style="font-size:12px">暂无规格值，请添加</span>';
    document.querySelectorAll("[data-sv-remove]").forEach(b=>b.onclick=()=>{
        specModalState.values.splice(+b.dataset.svRemove,1);renderSpecModalValues();
    });
}
$("specModalAddVal").onclick=()=>{
    const v=$("specModalNewVal").value.trim();
    if(!v) return;
    if(specModalState.values.includes(v)){toast("已存在");return;}
    specModalState.values.push(v);
    $("specModalNewVal").value="";
    renderSpecModalValues();
};
$("specModalNewVal").onkeydown=e=>{if(e.key==="Enter"){$("specModalAddVal").onclick();e.preventDefault();}};
$("specModalClose").onclick=()=>$("specModal").classList.remove("show");
$("specModal").onclick=e=>{if(e.target.id==="specModal")$("specModal").classList.remove("show");};
$("specModalSave").onclick=()=>{
    const name=$("specModalName").value.trim();
    if(!name){toast("请填写规格名称");return;}
    const p=products.find(x=>x.id===selectedProductId);
    if(!p) return;
    if(specModalState.editingIdx>=0){
        p.specs[specModalState.editingIdx].name=name;
        p.specs[specModalState.editingIdx].values=[...specModalState.values];
    }else{
        if(p.specs.some(s=>s.name===name)){toast("规格名称已存在");return;}
        p.specs.push({name,values:[...specModalState.values]});
    }
    $("specModal").classList.remove("show");
    renderSkuPanel();toast("规格已保存");
};
$("specModalDelete").onclick=()=>{
    if(specModalState.editingIdx<0) return;
    if(!confirm("确定删除该规格吗？相关的组合也会受影响。")) return;
    const p=products.find(x=>x.id===selectedProductId);
    p.specs.splice(specModalState.editingIdx,1);
    $("specModal").classList.remove("show");
    renderSkuPanel();toast("已删除");
};

// ========== 渲染 SKU 规格面板（淘宝风格选择器） ==========
let skuSelected = {}; // { specName: selectedValue }
function renderSkuPanel(){
    const wrap=$("skuAreaWrap");
    if(!selectedProductId){
        wrap.innerHTML='<div class="empty">请先选择产品型号</div>';return;
    }
    const p = products.find(x=>x.id===selectedProductId);
    if(!p){wrap.innerHTML='<div class="empty">未找到该产品数据</div>';return;}

    // 初始化 skuSelected（每个 spec 默认选第一个值）
    p.specs.forEach(s=>{
        if(!skuSelected[s.name] && s.values.length){
            skuSelected[s.name] = s.values[0];
        }
    });

    wrap.innerHTML=`<div class="spec-area">
<div class="spec-head"><strong>SKU / 规格选择</strong><span class="muted">${esc(p.name)} · ${esc(p.code)}</span></div>
<div class="spec-body">
${p.specs.map((s)=>`<div class="sku-row">
<div class="sku-row-label">${esc(s.name)}</div>
<div class="sku-row-values">
${s.values.map(v=>`<span class="sku-value ${skuSelected[s.name]===v?'selected':''}" data-spec-name="${esc(s.name)}" data-val="${esc(v)}">${esc(v)}</span>`).join("")}
</div>
</div>`).join("")}
${!p.specs.length ? '<div class="empty">该产品暂无规格</div>' : ''}
</div>
</div>`;

    // 绑定选择器
    document.querySelectorAll(".sku-value").forEach(el=>el.onclick=()=>{
        skuSelected[el.dataset.specName] = el.dataset.val;
        renderSkuPanel();
        selectedSku = el.dataset.val;
    });
}

// ========== 事件绑定 ==========
function selectRecord(id){
    selectedId=id;
    const r=currentRecord();
    if(r?.category) selectedCategoryKey = r.category; else selectedCategoryKey="";
    if(r?.productId) selectedProductId=r.productId; else selectedProductId=null;
    if(r?.sku) selectedSku=r.sku; else selectedSku="";
    renderRecords();renderTree();renderModelList();renderSkuPanel();
    $("matchSummary").textContent = r?.matched ? `已匹配：${r.product_name} → ${r.sku||""}` : "尚未完成全部选择";
}

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
    filter=b.dataset.filter;
    document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));
    renderRecords();
});
$("recordSearch").oninput=renderRecords;
$("clearSearch").onclick=()=>{$("recordSearch").value="";renderRecords()};
$("modelSearch").oninput=renderModelList;
$("clearModelSearch").onclick=()=>{$("modelSearch").value="";renderModelList()};

$("syncBtn").onclick=()=>toast("已刷新列表（正式环境将从 OA 同步）");

$("clearMatch").onclick=()=>{
    selectedCategoryKey="";selectedProductId=null;selectedSku="";
    skuSelected={};
    renderTree();renderModelList();renderSkuPanel();
    $("matchSummary").textContent="尚未完成全部选择";
    toast("已清除全部选择");
};
$("saveMatch").onclick=()=>{
    const r=currentRecord();
    const p=products.find(pr=>pr.id===selectedProductId);
    if(!r){toast("请先选择询价记录");return;}
    if(!selectedCategoryKey){toast("请先选择三级分类");return;}
    if(!p){toast("请选择产品型号");return;}
    if(!selectedSku){
        const skuVal = Object.values(skuSelected).join(" / ");
        selectedSku = skuVal || p.skus.find(s=>s===r.specification?.split(/\s*[\/　]\s*/)[0]) || p.skus[0] || "";
    }
    r.matched=true;r.category=selectedCategoryKey;r.productId=p.id;r.sku=selectedSku;
    renderRecords();
    $("matchSummary").textContent=`✅ 已保存：${r.product_name} → ${p.name} / ${selectedSku}`;
    toast("匹配已保存");
};

// ========== 初始化 ==========
selectedId=100231;renderRecords();renderTree();selectRecord(selectedId);
